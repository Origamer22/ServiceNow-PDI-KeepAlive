name: ServiceNow PDI Keep-Alive

on:
  schedule:
    # Runs every 1 hour on Sun-Thu
    - cron: '0 * * * 0-4'
    # Runs every 1 hour on Friday from 00:00 to 09:59 UTC (Ends before Friday 13:00 Israel time)
    - cron: '0 0-9 * * 5'
    # Runs every 1 hour on Saturday from 18:00 to 23:59 UTC (Starts from Saturday 21:00 Israel time)
    - cron: '0 18-23 * * 6'
  workflow_dispatch: # Enables manual execution from GitHub UI

jobs:
  ping-instance:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Ping ServiceNow Table API
        run: |
          # Strip trailing slashes from the instance URL if present
          URL="${{ secrets.SN_INSTANCE_URL }}"
          URL="${URL%/}"

          # Execute a lightweight GET request against the User table from ServiceNow
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "${{ secrets.SN_USERNAME }}:${{ secrets.SN_PASSWORD }}" \
            -H "Accept: application/json" \
            "$URL/api/now/table/sys_user?sysparm_limit=1")

          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 201 ]; then
            exit 0
          else
            exit 1
          fi

      - name: Keepalive Commit
        run: |
          LAST_COMMIT=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST_COMMIT) / 86400 ))
          if [ $DAYS -gt 50 ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive commit"
            git push origin HEAD:${{ github.ref_name }}
          fi

